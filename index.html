<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Peddi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>

<style>
body{
  margin:0;
  font-family:Inter,sans-serif;
  background:#0a0a0a;
  color:#fff;
}

/* ---------- GLOBAL ---------- */
section{
  padding:8vh 6vw;
}

h1,h2{
  font-family:"Playfair Display",serif;
}

/* ---------- HERO ---------- */
.hero{
  display:grid;
  grid-template-columns:1fr;
  gap:32px;
  min-height:100vh;
}

.hero h1{
  font-size:clamp(48px,7vw,120px);
  line-height:1;
}

.hero-img{
  border-radius:16px;
  overflow:hidden;
  aspect-ratio:3/4;
}

.hero-img img{
  width:120%;
  height:120%;
  object-fit:cover;
}

/* ---------- SCENE ---------- */
.scene{
  display:flex;
  flex-direction:column;
  gap:20px;
}

.scene-label{
  font-size:12px;
  letter-spacing:.3em;
  opacity:.6;
}

.scene-title{
  font-size:clamp(40px,6vw,96px);
  line-height:1.05;
}

.scene-subtext{
  max-width:520px;
  opacity:.7;
  margin-bottom:20px;
}

/* ---------- MEDIA GRID (PHONE STYLE EVERYWHERE) ---------- */
.media-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:24px;
}

.media{
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 20px 40px rgba(0,0,0,.45);
  aspect-ratio:3/4;
}

.media img,
.media video{
  width:120%;
  height:120%;
  object-fit:cover;
}

/* ---------- BACKGROUNDS ---------- */
.red{
  background:
  radial-gradient(circle at 30% 20%, rgba(80,0,0,.45), rgba(0,0,0,.9)),
  url('images/vangogh-red.jpg') center/cover no-repeat;
}

.white{
  background:
  radial-gradient(circle at 70% 30%, rgba(255,255,255,.4), rgba(235,235,235,.9)),
  url('images/vangogh-white.jpg') center/cover no-repeat;
  color:#111;
}

.black{
  background:
  radial-gradient(circle at 50% 40%, rgba(17,17,17,.6), rgba(0,0,0,.95)),
  url('images/vangogh-black.jpg') center/cover no-repeat;
}

/* ---------- DESKTOP: SAME AS PHONE, JUST WIDER ---------- */
@media(min-width:900px){
  .media-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

/* ---------- FOOTER ---------- */
footer{
  padding:80px 6vw;
  text-align:center;
  font-size:12px;
  letter-spacing:.25em;
  opacity:.5;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">
  <h1>Peddi:<br>First Ball,<br>First Six</h1>
  <div class="hero-img media">
    <img src="images/rt3.jpeg">
  </div>
</section>

<!-- RED -->
<section class="scene red">
  <div class="scene-label">Crimson Motion</div>
  <div class="scene-title">The Instinct</div>
  <div class="scene-subtext">Where form meets force.</div>

  <div class="media-grid">
    <div class="media"><img src="images/rtsm.jpeg"></div>
    <div class="media"><video autoplay muted loop playsinline><source src="videos/rtsmv.mp4"></video></div>
    <div class="media"><img src="images/fsrs.jpeg"></div>
    <div class="media"><img src="images/rts.jpeg"></div>
    <div class="media"><img src="images/rts2.jpeg"></div>
  </div>
</section>

<!-- WHITE -->
<section class="scene white">
  <div class="scene-label">White Calm</div>
  <div class="scene-title">The Breath</div>

  <div class="media-grid">
    <div class="media"><img src="images/wts.jpeg"></div>
    <div class="media"><img src="images/wts2.jpeg"></div>
    <div class="media"><img src="images/fsws.jpeg"></div>
    <div class="media"><img src="images/fsws2.jpeg"></div>
    <div class="media"><img src="images/fsws3.jpeg"></div>
  </div>
</section>

<!-- BLACK -->
<section class="scene black">
  <div class="scene-label">Noir Echo</div>
  <div class="scene-title">The Silence</div>

  <div class="media-grid">
    <div class="media"><img src="images/fsbs.jpeg"></div>
    <div class="media"><img src="images/fsbs2.jpeg"></div>
  </div>
</section>

<footer>© 2026 Peddi</footer>

<script>
/* IMMERSIVE INNER MOTION (FRAME STAYS STILL) */
document.querySelectorAll('.media').forEach((media,i)=>{
  const inner = media.querySelector('img,video');
  const drift = i % 2 ? 1 : -1;

  gsap.fromTo(inner,
    { scale:1.1, x:0, y:0 },
    {
      scale:1.25,
      x:25 * drift,
      y:-20 * drift,
      duration:3,
      ease:"sine.inOut",
      repeat:-1,
      yoyo:true
    }
  );
});
</script>

</body>
</html>
