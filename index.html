<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Peddi — Winter ’26</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>

<style>
:root{
  --lux-shadow: 0 40px 80px rgba(0,0,0,.15);
}

body{
  margin:0;
  font-family:Inter,sans-serif;
  background:#fefefe;
  overflow-x:hidden;
}

header{
  position:fixed;
  top:0;
  width:100%;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);
  z-index:100;
}

.nav{
  max-width:1400px;
  margin:auto;
  padding:18px 32px;
  display:flex;
  justify-content:space-between;
}

.brand{
  font-family:"Playfair Display",serif;
  letter-spacing:.25em;
}

/* ================= CRICKET ================= */

.cricket-container{
  position:fixed;
  bottom:40px;
  left:50%;
  transform:translateX(-50%);
  width:180px;
  display:flex;
  justify-content:space-between;
  z-index:20;
  pointer-events:none;
}

.wicket{
  width:16px;
  height:100px;
  background:#8b5a2b;
  transform-origin:bottom;
}

.ball{
  width:44px;
  height:44px;
  border-radius:50%;
  position:fixed;
  bottom:20px;
  left:20px;
  z-index:30;
  filter:drop-shadow(0 10px 6px rgba(0,0,0,.25));
}

/* ================= COLLECTIONS ================= */

.collection{
  min-height:100vh;
  padding:160px 6vw 120px;
  opacity:0;
  position:relative;
}

/* HEADINGS */
.collection h2{
  font-family:"Playfair Display",serif;
  font-size:clamp(48px,6vw,96px);
  margin-bottom:60px;
}

/* ===== RED – HERO EDITORIAL ===== */

.red-editorial{
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:60px;
  align-items:center;
}

.red-editorial img{
  width:100%;
  height:80vh;
  object-fit:cover;
  box-shadow:var(--lux-shadow);
}

.red-editorial video{
  width:100%;
  height:80vh;
  object-fit:cover;
  box-shadow:var(--lux-shadow);
}

/* Supporting row */
.support-strip{
  margin-top:80px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:40px;
}

.support-strip img{
  width:100%;
  height:420px;
  object-fit:cover;
}

/* ===== WHITE – CLEAN LAYERED ===== */

.white-grid{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:60px;
}

.white-grid img:first-child{
  height:90vh;
  object-fit:cover;
}

.white-stack{
  display:grid;
  gap:30px;
}

.white-stack img{
  height:42vh;
  object-fit:cover;
}

/* ===== BLACK – DRAMATIC STRIP ===== */

.black-strip{
  display:flex;
  gap:60px;
}

.black-strip img{
  width:33%;
  height:80vh;
  object-fit:cover;
  box-shadow:var(--lux-shadow);
}

/* FOOTER */
footer{
  padding:80px;
  text-align:center;
  font-size:12px;
  color:#666;
  border-top:1px solid #eee;
}

/* MOBILE */
@media(max-width:900px){
  .red-editorial,
  .white-grid,
  .black-strip{
    grid-template-columns:1fr;
    flex-direction:column;
  }

  .support-strip{
    grid-template-columns:1fr;
  }

  .black-strip img{
    width:100%;
    height:60vh;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="brand">PEDDI</div>
  </div>
</header>

<!-- Cricket -->
<div class="cricket-container">
  <div class="wicket" id="w1"></div>
  <div class="wicket" id="w2"></div>
  <div class="wicket" id="w3"></div>
</div>
<div class="ball" id="ball"></div>

<!-- RED -->
<section class="collection" id="red" style="background:#ffe5e5;">
  <h2>Red Collection</h2>

  <div class="red-editorial">
    <img src="images/rtsm.jpeg">
    <video muted loop playsinline id="redVideo">
      <source src="videos/rtsmv.mp4">
    </video>
  </div>

  <div class="support-strip">
    <img src="images/rt3.jpeg">
    <img src="images/rts.jpeg">
    <img src="images/rts2.jpeg">
  </div>
</section>

<!-- WHITE -->
<section class="collection" id="white" style="background:#f5f5f5;">
  <h2>White Collection</h2>

  <div class="white-grid">
    <img src="images/wts.jpeg">
    <div class="white-stack">
      <img src="images/fsws.jpeg">
      <img src="images/fsws2.jpeg">
      <img src="images/fsws3.jpeg">
    </div>
  </div>
</section>

<!-- BLACK -->
<section class="collection" id="black" style="background:#111;color:#fff;">
  <h2>Black Collection</h2>

  <div class="black-strip">
    <img src="images/fsbs.jpeg">
    <img src="images/fsbs2.jpeg">
    <img src="images/fsbs.jpeg">
  </div>
</section>

<footer>© 2026 Peddi</footer>

<script>
gsap.registerPlugin(ScrollTrigger);

const ball = document.getElementById("ball");
const wickets = [w1,w2,w3];
const sections = [red,white,black];
const colors = ["red","white","black"];

sections.forEach((sec,i)=>{
  ScrollTrigger.create({
    trigger:sec,
    start:"top center",
    pin:true,
    onEnter:()=>{
      ball.style.background = colors[i];
      gsap.set(ball,{x:0,y:0});

      const r = wickets[i].getBoundingClientRect();

      gsap.to(ball,{
        x:r.left - 20,
        y:-200,
        duration:.8,
        ease:"power2.out",
        onComplete:()=>{
          gsap.to(wickets[i],{rotation:-90,duration:.4});
          gsap.to(sec,{opacity:1,duration:.6});
          gsap.to(ball,{
            x:window.innerWidth+100,
            y:window.innerHeight+100,
            duration:.7
          });
        }
      });
    }
  });
});
</script>

</body>
</html>
