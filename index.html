<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Peddi — Winter ’26</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>

<style>
body { margin:0; font-family:Inter,sans-serif; overflow-x:hidden; background:#fefefe; }
header { position: fixed; top:0; width:100%; background: rgba(255,255,255,.92); backdrop-filter: blur(10px); z-index:100; }
.nav { max-width:1400px; margin:auto; padding:18px 32px; display:flex; justify-content:space-between; align-items:center; }
.brand { font-family:"Playfair Display",serif; font-size:18px; letter-spacing:.25em; }
.nav a { margin-left:26px; font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:#666; text-decoration:none; }
.nav a:hover { color:#111; }

/* Cricket animation sections */
.cricket-section { position:relative; width:100%; height:100vh; overflow:hidden; display:flex; justify-content:center; align-items:flex-end; }
.ball { width:50px; height:50px; background:red; border-radius:50%; position:absolute; bottom:100px; left:0; z-index:50; }
.wicket { width:20px; height:100px; background:#8b5a2b; position:absolute; bottom:100px; transform-origin:bottom center; }

/* Collections */
.collection { width:100%; min-height:80vh; display:flex; justify-content:center; align-items:center; opacity:0; flex-direction:column; gap:20px; padding:40px 20px; }
.split { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; }
.split img, .split video { flex:1; min-width:250px; max-height:60vh; border-radius:4px; object-fit:contain; }

/* Footer */
footer { padding:60px 24px; text-align:center; font-size:12px; color:#666; border-top:1px solid #eee; }

/* Mobile */
@media(max-width:900px){
  .ball { width:35px; height:35px; }
  .split img, .split video { max-height:45vh; min-width:150px; }
}
</style>
</head>
<body>

<header>
  <div class="nav">
    <div class="brand">PEDDI</div>
    <nav>
      <a href="#collection">Collection</a>
      <a href="#experience">Experience</a>
      <a href="#lookbook">Lookbook</a>
    </nav>
  </div>
</header>

<!-- CRICKET + RED COLLECTION -->
<div class="cricket-section" id="cricket1">
  <div class="ball" id="ball1"></div>
  <div class="wicket" id="wicket1" style="left:30%;"></div>
</div>
<section class="collection" id="redCollection" style="background:#ffe5e5;">
  <div class="split">
    <img src="images/rtsm.jpeg" alt="Red T-shirt Mannequin">
    <video id="redVideo" muted loop playsinline>
      <source src="videos/rtsmv.mp4" type="video/mp4">
    </video>
  </div>
  <img src="images/fsrs.jpeg" alt="Full Sleeve Red">
  <div class="split">
    <img src="images/rts.jpeg" alt="Red T-shirt">
    <img src="images/rts2.jpeg" alt="Red T-shirt Alt">
  </div>
</section>

<!-- CRICKET + WHITE COLLECTION -->
<div class="cricket-section" id="cricket2">
  <div class="ball" id="ball2"></div>
  <div class="wicket" id="wicket2" style="left:50%;"></div>
</div>
<section class="collection" id="whiteCollection" style="background:#f5f5f5;">
  <img src="images/wts.jpeg" alt="White T-shirt">
  <div class="split">
    <img src="images/wts2.jpeg" alt="White T-shirt Alt">
    <img src="images/fsws.jpeg" alt="Full Sleeve White">
    <img src="images/fsws2.jpeg" alt="Full Sleeve White Alt">
    <img src="images/fsws3.jpeg" alt="Full Sleeve White Alt 2">
  </div>
</section>

<!-- CRICKET + BLACK COLLECTION -->
<div class="cricket-section" id="cricket3">
  <div class="ball" id="ball3"></div>
  <div class="wicket" id="wicket3" style="left:70%;"></div>
</div>
<section class="collection" id="blackCollection" style="background:#111; color:#fff;">
  <div class="split">
    <img src="images/fsbs.jpeg" alt="Black Sleeve">
    <img src="images/fsbs2.jpeg" alt="Black Sleeve Alt">
    <img src="images/fsbs.jpeg" alt="Black Sleeve Duplicate">
  </div>
</section>

<footer>© 2026 Peddi</footer>
<audio id="hitSound" src="wicket-hit.mp3"></audio>

<script>
gsap.registerPlugin(ScrollTrigger);

// Function to animate one ball + wicket + collection
function animateCricket(ballId, wicketId, collectionId, videoId){
  const ball = document.getElementById(ballId);
  const wicket = document.getElementById(wicketId);
  const collection = document.getElementById(collectionId);
  const video = videoId ? document.getElementById(videoId) : null;
  const hitSound = document.getElementById('hitSound');

  collection.style.opacity=0;
  if(video) video.pause();

  ScrollTrigger.create({
    trigger: "#"+ballId,
    start: "top center",
    end: "bottom center",
    scrub:1,
    pin:true,
    onEnter: ()=>{
      gsap.to(ball, {x: parseInt(wicket.style.left)/100*window.innerWidth, y:-150, rotation:360, scaleX:1.2, scaleY:0.8, duration:0.8,
        onComplete: ()=>{
          gsap.to(ball, {y:0, rotation:720, scaleX:1, scaleY:1, duration:0.5, ease:"bounce.out"});
          hitSound.currentTime=0; hitSound.play();
          gsap.to(wicket, {rotation:-90, duration:0.5, ease:"power2.inOut"});
          gsap.to(collection, {opacity:1, duration:0.5});
          if(video) video.play();
        }
      });
    }
  });
}

// Animate each sequentially
animateCricket("ball1","wicket1","redCollection","redVideo");
animateCricket("ball2","wicket2","whiteCollection",null);
animateCricket("ball3","wicket3","blackCollection",null);

</script>
</body>
</html>
