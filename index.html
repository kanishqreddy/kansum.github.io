<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🗡️ NIGHT CITY 🗡️</title>

  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #050008;
      --accent: #ff3c00;
      --accent2: #ffb300;
      --text: #ffffff;
      --muted: #a19ad0;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Rajdhani", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,60,0,0.3), transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(255,179,0,0.3), transparent 60%),
        #050008;
      color: var(--text);
      overflow-x: hidden;
    }

    header {
      text-align: center;
      padding: 40px 20px 20px;
    }

    .title {
      font-size: clamp(32px, 5vw, 48px);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      text-shadow:
        0 0 10px var(--accent),
        0 0 30px var(--accent2);
    }

    .subtitle {
      font-family: "Share Tech Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--muted);
      margin-top: 10px;
    }

    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .project-card {
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(10,0,20,0.9);
      box-shadow:
        0 0 30px rgba(255,60,0,0.4),
        0 20px 60px rgba(0,0,0,0.8);
      transition: 0.3s ease;
    }

    .project-card:hover {
      transform: translateY(-5px);
      box-shadow:
        0 0 40px rgba(255,179,0,0.8),
        0 25px 80px rgba(0,0,0,1);
    }

    .iframe-header {
      background: #120010;
      padding: 10px;
      display: flex;
      gap: 6px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .dot.red { background: #ff3c00; }
    .dot.yellow { background: #ffb300; }
    .dot.green { background: #00ff88; }

    iframe {
      width: 100%;
      height: 75vh;
      border: none;
      background: black;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      font-size: 12px;
      letter-spacing: 0.2em;
      color: var(--muted);
      border-top: 1px solid rgba(255,255,255,0.1);
      margin-top: 60px;
    }

    @media (max-width: 768px) {
      iframe {
        height: 70vh;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="title">Night City</div>
    <div class="subtitle">Cyber Project Interface · Online</div>
  </header>

  <main>
    <div class="project-card">
      <div class="iframe-header">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
      </div>

      <!-- 🔥 REPLACE LINK BELOW -->
      <iframe src="YOUR_PROJECT_LINK_HERE"></iframe>

    </div>
  </main>

  <footer>
    NIGHT CITY © 2077 · Built by Kansum
  </footer>

</body>
</html>
