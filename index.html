<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Peddi — Winter ’26</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --ease:cubic-bezier(.6,0,.1,1);
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Inter,sans-serif;
  background:#0a0a0a;
  color:#fff;
  overflow-x:hidden;
}

/* ---------------- GLOBAL ---------------- */

section{
  position:relative;
  min-height:100vh;
  padding:12vh 8vw;
}

.scene{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  align-items:center;
}

/* ---------------- TYPOGRAPHY ---------------- */

.scene-label{
  grid-column:1/5;
  font-size:12px;
  letter-spacing:.3em;
  text-transform:uppercase;
  opacity:.6;
}

.scene-title{
  grid-column:1/7;
  font-family:"Playfair Display",serif;
  font-size:clamp(56px,9vw,120px);
  line-height:.95;
  margin:24px 0 60px;
}

/* ---------------- FLOATING MEDIA ---------------- */

.media{
  position:absolute;
  transition:transform 1.2s var(--ease);
}

.media img,
.media video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* parallax */
[data-depth="1"]{transform:translateY(0)}
[data-depth="2"]{transform:translateY(0)}
[data-depth="3"]{transform:translateY(0)}

section:hover [data-depth="1"]{transform:translateY(-20px)}
section:hover [data-depth="2"]{transform:translateY(-40px)}
section:hover [data-depth="3"]{transform:translateY(-60px)}

/* ---------------- HERO ---------------- */

.hero{
  background:#000;
}

.hero h1{
  font-family:"Playfair Display",serif;
  font-size:clamp(64px,10vw,160px);
  line-height:1;
}

.hero img{
  position:absolute;
  right:0;
  top:0;
  width:55vw;
  height:100vh;
  object-fit:cover;
  opacity:.9;
}

/* ---------------- RED ---------------- */

.red{background:radial-gradient(circle at 30% 20%, #3a0000, #000)}

.red .m1{
  width:38vw;height:60vh;
  right:8vw;top:18vh;
}
.red .m2{
  width:28vw;height:38vh;
  left:6vw;bottom:14vh;
}
.red .m3{
  width:22vw;height:30vh;
  right:32vw;bottom:8vh;
}
.red video{
  width:100%;height:100%;
}

/* ---------------- WHITE ---------------- */

.white{
  background:radial-gradient(circle at 70% 30%, #ffffff, #e8e8e8);
  color:#111;
}

.white .m1{
  width:40vw;height:60vh;
  left:10vw;top:20vh;
}
.white .m2{
  width:24vw;height:32vh;
  right:8vw;top:16vh;
}
.white .m3{
  width:28vw;height:40vh;
  right:14vw;bottom:10vh;
}
.white .m4{
  width:20vw;height:28vh;
  left:36vw;bottom:8vh;
}
.white .m5{
  width:18vw;height:24vh;
  left:10vw;bottom:6vh;
}

/* ---------------- BLACK ---------------- */

.black{
  background:radial-gradient(circle at 50% 40%, #111, #000);
}

.black .m1{
  width:36vw;height:60vh;
  left:12vw;top:18vh;
}
.black .m2{
  width:30vw;height:44vh;
  right:12vw;bottom:12vh;
}

/* ---------------- FOOTER ---------------- */

footer{
  padding:80px 8vw;
  text-align:center;
  font-size:12px;
  letter-spacing:.25em;
  opacity:.5;
}

/* ---------------- MOBILE ---------------- */

@media(max-width:900px){
  .media{
    position:relative;
    width:100%!important;
    height:auto!important;
    margin-bottom:40px;
  }
  section{
    padding:100px 6vw;
  }
}
</style>
</head>
<body>

<!-- HERO -->
<section class="hero">
  <h1>Winter ’26<br>Peddi</h1>
  <img src="images/rt3.jpeg" alt="">
</section>

<!-- RED -->
<section class="scene red">
  <div class="scene-label">Crimson Motion</div>
  <div class="scene-title">The Instinct</div>

  <div class="media m1" data-depth="3">
    <img src="images/rtsm.jpeg">
  </div>

  <div class="media m2" data-depth="2">
    <video autoplay muted loop playsinline>
      <source src="videos/rtsmv.mp4">
    </video>
  </div>

  <div class="media m3" data-depth="1">
    <img src="images/fsrs.jpeg">
  </div>

  <div class="media m4" data-depth="2" style="width:20vw;height:26vh;left:28vw;top:14vh">
    <img src="images/rts.jpeg">
  </div>

  <div class="media m5" data-depth="1" style="width:18vw;height:24vh;right:18vw;top:10vh">
    <img src="images/rts2.jpeg">
  </div>
</section>

<!-- WHITE -->
<section class="scene white">
  <div class="scene-label">White Calm</div>
  <div class="scene-title">The Breath</div>

  <div class="media m1" data-depth="3">
    <img src="images/wts.jpeg">
  </div>
  <div class="media m2" data-depth="2">
    <img src="images/wts2.jpeg">
  </div>
  <div class="media m3" data-depth="1">
    <img src="images/fsws.jpeg">
  </div>
  <div class="media m4" data-depth="2">
    <img src="images/fsws2.jpeg">
  </div>
  <div class="media m5" data-depth="1">
    <img src="images/fsws3.jpeg">
  </div>
</section>

<!-- BLACK -->
<section class="scene black">
  <div class="scene-label">Noir Echo</div>
  <div class="scene-title">The Silence</div>

  <div class="media m1" data-depth="2">
    <img src="images/fsbs.jpeg">
  </div>
  <div class="media m2" data-depth="1">
    <img src="images/fsbs2.jpeg">
  </div>
</section>

<footer>
  © 2026 Peddi — Born from Motion
</footer>

</body>
</html>
