<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Peddi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>

<style>
body{
  margin:0;
  font-family:Inter,sans-serif;
  background:#0a0a0a;
  color:#fff;
  overflow-x:hidden;
}

/* MEDIA */
.media{
  position:absolute;
  border-radius:8px;
  box-shadow:0 20px 40px rgba(0,0,0,0.3);
  opacity:0;
  z-index:5;
  cursor:pointer;
  overflow:hidden;
}

.media img,
.media video{
  width:115%;
  height:115%;
  object-fit:cover;
  border-radius:8px;
  transform-origin:center;
}

.media:hover{
  transform:scale(1.05) translateY(-10px);
  box-shadow:0 40px 70px rgba(0,0,0,.6);
}

/* HERO */
.hero{
  display:flex;
  justify-content:space-between;
  align-items:center;
  min-height:100vh;
  padding:8vh 6vw;
}
.hero h1{
  font-family:"Playfair Display",serif;
  font-size:clamp(64px,10vw,160px);
  line-height:1;
  max-width:45%;
}
.hero .hero-img{
  width:40%;
  height:80vh;
  position:relative;
  top:10vh;
}

/* SCENES */
.scene{
  position:relative;
  min-height:100vh;
  padding:8vh 6vw;
  overflow:hidden;
  background-size:cover;
  background-position:center;
}
.scene-label{font-size:12px;letter-spacing:.3em;opacity:.6;}
.scene-title{font-family:"Playfair Display",serif;font-size:clamp(48px,8vw,120px);}
.scene-subtext{max-width:500px;opacity:.7;margin-bottom:60px;}

/* COLLECTIONS */
.red{
  background:radial-gradient(circle at 30% 20%,rgba(58,0,0,.4),rgba(0,0,0,.85)),
  url('images/vangogh-red.jpg') center/cover no-repeat;
}
.red .m1{width:35vw;height:55vh;left:5vw;top:20vh;}
.red .m2{width:28vw;height:38vh;right:6vw;top:25vh;}
.red .m3{width:22vw;height:30vh;left:20vw;bottom:10vh;}
.red .m4{width:18vw;height:28vh;right:28vw;bottom:5vh;}
.red .m5{width:20vw;height:32vh;left:40vw;bottom:20vh;}

.white{
  background:radial-gradient(circle at 70% 30%,rgba(255,255,255,.4),rgba(230,230,230,.85)),
  url('images/vangogh-white.jpg') center/cover no-repeat;
  color:#111;
}
.white .m1{width:38vw;height:55vh;left:5vw;top:18vh;}
.white .m2{width:28vw;height:38vh;right:6vw;top:22vh;}
.white .m3{width:24vw;height:32vh;left:28vw;bottom:10vh;}
.white .m4{width:18vw;height:28vh;right:28vw;bottom:15vh;}
.white .m5{width:20vw;height:30vh;left:40vw;bottom:20vh;}

.black{
  background:radial-gradient(circle at 50% 40%,rgba(17,17,17,.6),rgba(0,0,0,.9)),
  url('images/vangogh-black.jpg') center/cover no-repeat;
}
.black .m1{width:36vw;height:60vh;left:10vw;top:20vh;}
.black .m2{width:30vw;height:44vh;right:10vw;bottom:10vh;}

footer{
  padding:80px 6vw;
  text-align:center;
  font-size:12px;
  letter-spacing:.25em;
  opacity:.5;
}
</style>
</head>

<body>

<section class="hero">
  <h1>Peddi: First Ball, First Six</h1>
  <div class="media hero-img">
    <img src="images/rt3.jpeg">
  </div>
</section>

<section class="scene red">
  <div class="scene-label">Crimson Motion</div>
  <div class="scene-title">The Instinct</div>
  <div class="scene-subtext">Where form meets force.</div>

  <div class="media m1"><img src="images/rtsm.jpeg"></div>
  <div class="media m2"><video autoplay muted loop playsinline><source src="videos/rtsmv.mp4"></video></div>
  <div class="media m3"><img src="images/fsrs.jpeg"></div>
  <div class="media m4"><img src="images/rts.jpeg"></div>
  <div class="media m5"><img src="images/rts2.jpeg"></div>
</section>

<section class="scene white">
  <div class="scene-label">White Calm</div>
  <div class="scene-title">The Breath</div>

  <div class="media m1"><img src="images/wts.jpeg"></div>
  <div class="media m2"><img src="images/wts2.jpeg"></div>
  <div class="media m3"><img src="images/fsws.jpeg"></div>
  <div class="media m4"><img src="images/fsws2.jpeg"></div>
  <div class="media m5"><img src="images/fsws3.jpeg"></div>
</section>

<section class="scene black">
  <div class="scene-label">Noir Echo</div>
  <div class="scene-title">The Silence</div>

  <div class="media m1"><img src="images/fsbs.jpeg"></div>
  <div class="media m2"><img src="images/fsbs2.jpeg"></div>
</section>

<footer>© 2026 Peddi</footer>

<script>
gsap.registerPlugin(ScrollTrigger);

/* IMAGE = FADE-IN + MOTION + LOOP (ALL AT ONCE) */
document.querySelectorAll('.media img').forEach((img,i)=>{
  const dir = i % 2 === 0 ? 1 : -1;

  gsap.fromTo(img.parentElement,
    { opacity:0, y:40 },
    {
      opacity:1,
      y:0,
      duration:0.8,
      ease:"power2.out",
      scrollTrigger:{
        trigger:img.parentElement,
        start:"top 90%"
      }
    }
  );

  gsap.fromTo(img,
    { scale:1, x:0, y:0 },
    {
      scale:1.2,
      x:30 * dir,
      y:-25 * dir,
      duration:5,
      ease:"sine.inOut",
      repeat:-1,
      yoyo:true,
      scrollTrigger:{
        trigger:img.parentElement,
        start:"top 90%"
      }
    }
  );
});

/* HERO IMAGE */
const hero = document.querySelector('.hero-img img');
if(hero){
  gsap.fromTo(hero,
    { scale:1, y:0 },
    { scale:1.22, y:-30, duration:5, repeat:-1, yoyo:true, ease:"sine.inOut" }
  );
}
</script>

</body>
</html>
