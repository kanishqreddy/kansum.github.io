<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Peddi — Winter ’26</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>

<style>
:root {
  --bg:#ffffff;
  --text:#111;
  --muted:#666;
  --accent:#c1121f;
  --max:1400px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:Inter,sans-serif; background:var(--bg); color:var(--text); overflow-x:hidden; }
header { position: fixed; top:0; width:100%; background: rgba(255,255,255,.92); backdrop-filter: blur(10px); z-index:100; }
.nav { max-width:var(--max); margin:auto; padding:18px 32px; display:flex; justify-content:space-between; align-items:center; }
.brand { font-family:"Playfair Display",serif; font-size:18px; letter-spacing:.25em; }
.nav a { margin-left:26px; font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); text-decoration:none; }
.nav a:hover { color:var(--text); }
section { padding:0; opacity:0; transition:opacity 0.8s ease-out; }
section.visible { opacity:1; }

/* Cricket animation container */
.cricket-container { position:relative; width:100%; height:100vh; overflow:hidden; background:#fefefe; display:flex; justify-content:center; align-items:flex-end; }
.ball { width:50px; height:50px; background:red; border-radius:50%; position:absolute; bottom:100px; left:0; z-index:50; }
.wickets { position:absolute; bottom:100px; display:flex; gap:60px; }
.wicket { width:20px; height:100px; background:#8b5a2b; position:relative; transform-origin:bottom center; }
.collection { width:100%; min-height:80vh; display:flex; justify-content:center; align-items:center; font-size:48px; font-family:"Playfair Display",serif; text-transform:uppercase; opacity:0; }
.collection.visible { opacity:1; transition:opacity 0.5s; }

/* Mobile adjustments */
@media(max-width:900px){
  .ball { width:35px; height:35px; }
  .collection { font-size:32px; text-align:center; }
}
</style>
</head>
<body>

<header>
  <div class="nav">
    <div class="brand">PEDDI</div>
    <nav>
      <a href="#collection">Collection</a>
      <a href="#experience">Experience</a>
      <a href="#lookbook">Lookbook</a>
    </nav>
  </div>
</header>

<!-- Cricket animation + wickets -->
<div class="cricket-container">
  <div class="ball"></div>
  <div class="wickets">
    <div class="wicket" id="wicket1"></div>
    <div class="wicket" id="wicket2"></div>
    <div class="wicket" id="wicket3"></div>
  </div>
</div>

<!-- Collection Sections triggered by wickets -->
<section class="collection" id="redCollection" style="background:#ffe5e5;">Red Collection</section>
<section class="collection" id="whiteCollection" style="background:#f5f5f5;">White Collection</section>
<section class="collection" id="blackCollection" style="background:#e5e5e5; color:#fff;">Black Collection</section>

<footer style="padding:80px 24px;text-align:center;font-size:12px;color:#666;border-top:1px solid #eee;">
© 2026 Peddi
</footer>

<script>
gsap.registerPlugin(ScrollTrigger);

// Ball animation timeline
const ball = document.querySelector('.ball');
const redColl = document.getElementById('redCollection');
const whiteColl = document.getElementById('whiteCollection');
const blackColl = document.getElementById('blackCollection');
const wickets = [document.getElementById('wicket1'), document.getElementById('wicket2'), document.getElementById('wicket3')];

let tl = gsap.timeline({
  scrollTrigger: {
    trigger: ".cricket-container",
    start: "top top",
    end: "+=2000", // scroll distance
    scrub:1,
    pin:true,
    anticipatePin:1
  }
});

// First ball hits first wicket → show red collection
tl.to(ball, {x:window.innerWidth*0.25, y:-150, rotation:360, duration:1})
  .to(ball, {y:0, duration:0.5, ease:"bounce.out"})
  .to(wickets[0], {rotation:-90, duration:0.5, ease:"power2.inOut"})
  .to(redColl, {opacity:1, duration:0.5}, "-=0.3");

// Second ball hits second wicket → show white collection
tl.to(ball, {x:window.innerWidth*0.5, y:-150, rotation:360, duration:1})
  .to(ball, {y:0, duration:0.5, ease:"bounce.out"})
  .to(wickets[1], {rotation:-90, duration:0.5, ease:"power2.inOut"})
  .to(whiteColl, {opacity:1, duration:0.5}, "-=0.3");

// Third ball hits third wicket → show black collection
tl.to(ball, {x:window.innerWidth*0.75, y:-150, rotation:360, duration:1})
  .to(ball, {y:0, duration:0.5, ease:"bounce.out"})
  .to(wickets[2], {rotation:-90, duration:0.5, ease:"power2.inOut"})
  .to(blackColl, {opacity:1, duration:0.5}, "-=0.3");
</script>

</body>
</html>
