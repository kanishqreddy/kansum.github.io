<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Peddi — Winter ’26</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --dark:#0e0e0e;
  --light:#f7f7f7;
  --muted:#777;
}

*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Inter,sans-serif;
  background:#fff;
  color:#111;
  overflow-x:hidden;
}

section{
  padding:100px 6vw;
}

h1,h2{
  font-family:"Playfair Display",serif;
  font-weight:600;
}

.scene-title{
  font-size:clamp(36px,6vw,72px);
  line-height:1.05;
  margin-bottom:16px;
}

.scene-sub{
  font-size:15px;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:60px;
}

/* ---------- HERO ---------- */
.hero{
  min-height:100vh;
  display:grid;
  grid-template-columns:1.2fr .8fr;
  align-items:center;
  gap:60px;
}

.hero img{
  width:100%;
  height:85vh;
  object-fit:cover;
}

.hero h1{
  font-size:clamp(60px,10vw,140px);
  line-height:1;
}

/* ---------- SCENE LAYOUT ---------- */
.scene{
  position:relative;
}

.masonry{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:30px;
}

.masonry img,
.masonry video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.block-a{grid-column:1 / 7;}
.block-b{grid-column:7 / 13;}
.block-c{grid-column:1 / 5;}
.block-d{grid-column:5 / 9;}
.block-e{grid-column:9 / 13;}

.tall{height:70vh;}
.mid{height:50vh;}
.short{height:40vh;}

/* ---------- COLOR MOODS ---------- */
.red{
  background:linear-gradient(#fff, #ffeaea);
}

.white{
  background:#f6f6f6;
}

.black{
  background:#0d0d0d;
  color:#fff;
}

.black img{
  filter:contrast(1.05);
}

/* ---------- FOOTER ---------- */
footer{
  padding:80px 6vw;
  text-align:center;
  font-size:12px;
  letter-spacing:.2em;
  color:#777;
  background:#000;
  color:#aaa;
}

/* ---------- MOBILE ---------- */
@media(max-width:900px){
  .hero{
    grid-template-columns:1fr;
  }
  .hero img{
    height:60vh;
  }
  .masonry{
    grid-template-columns:1fr;
  }
  .block-a,.block-b,.block-c,.block-d,.block-e{
    grid-column:1;
  }
  .tall,.mid,.short{
    height:auto;
  }
}
</style>
</head>
<body>

<!-- HERO -->
<section class="hero">
  <h1>Winter ’26<br>By Peddi</h1>
  <img src="images/rt3.jpeg" alt="Peddi Red Tee">
</section>

<!-- 🔴 RED -->
<section class="scene red">
  <div class="scene-sub">Crimson Motion</div>
  <h2 class="scene-title">The Instinct</h2>

  <div class="masonry">
    <div class="block-a tall">
      <img src="images/rtsm.jpeg">
    </div>
    <div class="block-b tall">
      <video autoplay muted loop playsinline>
        <source src="videos/rtsmv.mp4" type="video/mp4">
      </video>
    </div>

    <div class="block-c mid">
      <img src="images/rts.jpeg">
    </div>
    <div class="block-d mid">
      <img src="images/rts2.jpeg">
    </div>
    <div class="block-e mid">
      <img src="images/fsrs.jpeg">
    </div>
  </div>
</section>

<!-- ⚪ WHITE -->
<section class="scene white">
  <div class="scene-sub">White Calm</div>
  <h2 class="scene-title">The Breath</h2>

  <div class="masonry">
    <div class="block-a tall">
      <img src="images/wts.jpeg">
    </div>
    <div class="block-b mid">
      <img src="images/wts2.jpeg">
    </div>
    <div class="block-c short">
      <img src="images/fsws.jpeg">
    </div>
    <div class="block-d short">
      <img src="images/fsws2.jpeg">
    </div>
    <div class="block-e short">
      <img src="images/fsws3.jpeg">
    </div>
  </div>
</section>

<!-- ⚫ BLACK -->
<section class="scene black">
  <div class="scene-sub">Noir Echo</div>
  <h2 class="scene-title">The Silence</h2>

  <div class="masonry">
    <div class="block-c tall">
      <img src="images/fsbs.jpeg">
    </div>
    <div class="block-d tall">
      <img src="images/fsbs2.jpeg">
    </div>
  </div>
</section>

<footer>
  © 2026 Peddi — Born from Motion
</footer>

</body>
</html>
