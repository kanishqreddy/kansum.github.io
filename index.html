<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Peddi® — Future Wear</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #07070b;
      --glass: rgba(255,255,255,0.06);
      --line: rgba(255,255,255,0.12);
      --text: #f5f5f7;
      --muted: #a1a1aa;
      --accent: #8b5cf6;
      --accent-soft: rgba(139,92,246,0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", system-ui, sans-serif;
      background: radial-gradient(circle at top, #0b0b16, var(--bg));
      color: var(--text);
      overflow-x: hidden;
    }

    /* NAV */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 10;
      backdrop-filter: blur(18px);
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      max-width: 1200px;
      margin: auto;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: "Orbitron", sans-serif;
      font-size: 20px;
      letter-spacing: 0.35em;
    }

    .nav a {
      color: var(--muted);
      text-decoration: none;
      margin-left: 28px;
      font-size: 13px;
      letter-spacing: 0.2em;
      transition: color 0.3s;
    }

    .nav a:hover {
      color: var(--text);
    }

    /* HERO */
    .hero {
      min-height: 100vh;
      display: grid;
      place-items: center;
      position: relative;
      padding: 120px 24px 80px;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 30%, var(--accent-soft), transparent 60%);
      z-index: -1;
      animation: glow 6s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { opacity: 0.4; }
      to { opacity: 0.8; }
    }

    .hero-inner {
      text-align: center;
      max-width: 820px;
      animation: fadeUp 1.2s ease forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero h1 {
      font-size: clamp(42px, 7vw, 82px);
      font-weight: 800;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    .hero p {
      margin-top: 20px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .hero button {
      margin-top: 40px;
      padding: 14px 34px;
      border-radius: 999px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--text);
      letter-spacing: 0.3em;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .hero button:hover {
      background: var(--accent);
      box-shadow: 0 0 30px var(--accent-soft);
    }

    /* COLLECTION */
    section {
      max-width: 1200px;
      margin: auto;
      padding: 120px 24px;
    }

    .section-title {
      font-size: 14px;
      letter-spacing: 0.4em;
      color: var(--muted);
      margin-bottom: 40px;
      text-transform: uppercase;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 32px;
    }

    .card {
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      background: var(--glass);
      border: 1px solid var(--line);
      backdrop-filter: blur(16px);
      transform: translateY(20px);
      opacity: 0;
      transition: all 0.6s ease;
    }

    .card.show {
      transform: translateY(0);
      opacity: 1;
    }

    .card img {
      width: 100%;
      height: 420px;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .card:hover img {
      transform: scale(1.08);
    }

    .card-info {
      position: absolute;
      bottom: 0;
      width: 100%;
      padding: 18px;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    }

    .card-info h3 {
      font-size: 14px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .card-info span {
      font-size: 12px;
      color: var(--muted);
    }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--line);
      text-align: center;
      padding: 40px 20px;
      font-size: 11px;
      letter-spacing: 0.3em;
      color: var(--muted);
    }
  </style>
</head>
<body>

<header>
  <div class="nav">
    <div class="logo">PEDDI</div>
    <nav>
      <a href="#collection">Collection</a>
      <a href="#about">Vision</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <h1>Peddi</h1>
    <p>
      Future-focused silhouettes.  
      Designed for movement, presence, and identity.
    </p>
    <button>Explore Collection</button>
  </div>
</section>

<section id="collection">
  <div class="section-title">Latest Drop</div>
  <div class="grid">
    <div class="card">
      <img src="images/model1.jpg" alt="">
      <div class="card-info">
        <h3>Neo Jacket</h3>
        <span>Limited Edition</span>
      </div>
    </div>
    <div class="card">
      <img src="images/model2.jpg" alt="">
      <div class="card-info">
        <h3>Core Tee</h3>
        <span>Future Fit</span>
      </div>
    </div>
    <div class="card">
      <img src="images/model3.jpg" alt="">
      <div class="card-info">
        <h3>Urban Layer</h3>
        <span>Peddi Signature</span>
      </div>
    </div>
  </div>
</section>

<footer>
  PEDDI® — FUTURE WEAR
</footer>

<script>
  const cards = document.querySelectorAll('.card');

  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('show');
      }
    });
  }, { threshold: 0.2 });

  cards.forEach(card => observer.observe(card));
</script>

</body>
</html>
