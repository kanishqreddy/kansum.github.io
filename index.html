<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Peddi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>

<style>
body{
  margin:0;
  font-family:Inter,sans-serif;
  background:#0a0a0a;
  color:#fff;
  overflow-x:hidden;
}

/* ---------------- MEDIA ---------------- */
.media{
  position:absolute;
  border-radius:8px;
  box-shadow:0 20px 40px rgba(0,0,0,0.3);
  opacity:0;
  z-index:5;
  cursor:pointer;
  transition: transform .4s ease, box-shadow .4s ease;
  will-change: transform;
}

.media img,
.media video{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:8px;
  will-change: transform;
}

.media:hover{
  transform: scale(1.06) translateY(-12px) rotateZ(.4deg);
  box-shadow:0 40px 70px rgba(0,0,0,.6);
}

.media:hover img{
  filter:contrast(1.05) saturate(1.05);
}

/* ---------------- LIGHTBOX ---------------- */
#lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

#lightbox img,
#lightbox video{
  max-width:90%;
  max-height:90%;
  border-radius:8px;
}

/* ---------------- HERO ---------------- */
.hero{
  display:flex;
  justify-content:space-between;
  align-items:center;
  min-height:100vh;
  padding:8vh 6vw;
}

.hero h1{
  font-family:"Playfair Display",serif;
  font-size:clamp(64px,10vw,160px);
  line-height:1;
  max-width:45%;
  position:relative;
  z-index:10;
}

.hero .hero-img{
  position:relative;
  width:40%;
  height:80vh;
  top:10vh;
}

/* ---------------- SCENES ---------------- */
.scene{
  position:relative;
  min-height:100vh;
  padding:8vh 6vw;
  overflow:hidden;
  background-size:cover;
  background-position:center;
}

.scene-label{
  font-size:12px;
  letter-spacing:.3em;
  text-transform:uppercase;
  opacity:.6;
}

.scene-title{
  font-family:"Playfair Display",serif;
  font-size:clamp(48px,8vw,120px);
  line-height:1.05;
}

.scene-subtext{
  font-size:16px;
  max-width:500px;
  opacity:.7;
  margin-bottom:60px;
}

/* ---------------- COLLECTIONS ---------------- */
.red{
  background:
  radial-gradient(circle at 30% 20%, rgba(58,0,0,.4), rgba(0,0,0,.6)),
  url('images/vangogh-red.jpg') center/cover no-repeat;
}
.red .m1{width:35vw;height:55vh;left:5vw;top:20vh;}
.red .m2{width:28vw;height:38vh;right:6vw;top:25vh;}
.red .m3{width:22vw;height:30vh;left:20vw;bottom:10vh;}
.red .m4{width:18vw;height:28vh;right:28vw;bottom:5vh;}
.red .m5{width:20vw;height:32vh;left:40vw;bottom:20vh;}

.white{
  background:
  radial-gradient(circle at 70% 30%, rgba(255,255,255,.4), rgba(230,230,230,.6)),
  url('images/vangogh-white.jpg') center/cover no-repeat;
  color:#111;
}
.white .m1{width:38vw;height:55vh;left:5vw;top:18vh;}
.white .m2{width:28vw;height:38vh;right:6vw;top:22vh;}
.white .m3{width:24vw;height:32vh;left:28vw;bottom:10vh;}
.white .m4{width:18vw;height:28vh;right:28vw;bottom:15vh;}
.white .m5{width:20vw;height:30vh;left:40vw;bottom:20vh;}

.black{
  background:
  radial-gradient(circle at 50% 40%, rgba(17,17,17,.5), rgba(0,0,0,.7)),
  url('images/vangogh-black.jpg') center/cover no-repeat;
}
.black .m1{width:36vw;height:60vh;left:10vw;top:20vh;}
.black .m2{width:30vw;height:44vh;right:10vw;bottom:10vh;}

/* ---------------- FOOTER ---------------- */
footer{
  padding:80px 6vw;
  text-align:center;
  font-size:12px;
  letter-spacing:.25em;
  opacity:.5;
}

/* ---------------- PARTICLES ---------------- */
.particle{
  position:absolute;
  width:6px;
  height:6px;
  border-radius:50%;
  opacity:.25;
  background:white;
  pointer-events:none;
}
</style>
</head>

<body>

<section class="hero">
  <h1>Peddi: First Ball, First Six</h1>
  <div class="media hero-img">
    <img src="images/rt3.jpeg">
  </div>
</section>

<section class="scene red">
  <div class="scene-label">Crimson Motion</div>
  <div class="scene-title">The Instinct</div>
  <div class="scene-subtext">Where form meets force.</div>

  <div class="media m1"><img src="images/rtsm.jpeg"></div>
  <div class="media m2"><video autoplay muted loop playsinline><source src="videos/rtsmv.mp4"></video></div>
  <div class="media m3"><img src="images/fsrs.jpeg"></div>
  <div class="media m4"><img src="images/rts.jpeg"></div>
  <div class="media m5"><img src="images/rts2.jpeg"></div>
</section>

<section class="scene white">
  <div class="scene-label">White Calm</div>
  <div class="scene-title">The Breath</div>

  <div class="media m1"><img src="images/wts.jpeg"></div>
  <div class="media m2"><img src="images/wts2.jpeg"></div>
  <div class="media m3"><img src="images/fsws.jpeg"></div>
  <div class="media m4"><img src="images/fsws2.jpeg"></div>
  <div class="media m5"><img src="images/fsws3.jpeg"></div>
</section>

<section class="scene black">
  <div class="scene-label">Noir Echo</div>
  <div class="scene-title">The Silence</div>

  <div class="media m1"><img src="images/fsbs.jpeg"></div>
  <div class="media m2"><img src="images/fsbs2.jpeg"></div>
</section>

<footer>© 2026 Peddi</footer>

<div id="lightbox"><img><video controls></video></div>

<script>
gsap.registerPlugin(ScrollTrigger);

/* ENTRY FLOAT */
gsap.utils.toArray('.media').forEach(el=>{
  gsap.fromTo(el,{y:60,opacity:0},{y:-20,opacity:1,duration:1.2,
    scrollTrigger:{trigger:el,start:"top 85%",scrub:1}});
});

/* AMBIENT BREATHING (KEY EFFECT) */
gsap.utils.toArray('.media img').forEach((img,i)=>{
  gsap.to(img,{
    scale:1.04,
    duration:6+Math.random()*4,
    repeat:-1,
    yoyo:true,
    ease:"sine.inOut",
    delay:i*.2
  });
});

/* MICRO DRIFT */
gsap.utils.toArray('.media').forEach((el,i)=>{
  gsap.to(el,{
    y:i%2?40:-40,
    scrollTrigger:{trigger:el,start:"top bottom",end:"bottom top",scrub:true}
  });
});

/* PARTICLES */
for(let i=0;i<30;i++){
  const p=document.createElement('div');
  p.className='particle';
  p.style.left=Math.random()*100+'vw';
  p.style.top=Math.random()*100+'vh';
  document.body.appendChild(p);
  gsap.to(p,{y:200,x:50,repeat:-1,yoyo:true,duration:10+Math.random()*10,ease:"sine.inOut"});
}

/* LIGHTBOX */
const lb=document.getElementById('lightbox');
const lbImg=lb.querySelector('img');
const lbVid=lb.querySelector('video');

document.querySelectorAll('.media img').forEach(img=>{
  img.onclick=()=>{lbVid.pause();lbVid.style.display='none';lbImg.src=img.src;lbImg.style.display='block';lb.style.display='flex';}
});

document.querySelectorAll('.media video').forEach(v=>{
  v.onclick=()=>{lbImg.style.display='none';lbVid.src=v.querySelector('source').src;lbVid.style.display='block';lbVid.play();lb.style.display='flex';}
});

lb.onclick=()=>{lb.style.display='none';lbVid.pause();};
</script>

</body>
</html>
