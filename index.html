<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Peddi — Winter ’26</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>

<style>
body{
  margin:0;
  font-family:Inter,sans-serif;
  background:#fff;
  overflow-x:hidden;
}

header{
  position:fixed;
  top:0;
  width:100%;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);
  z-index:100;
}

.nav{
  max-width:1400px;
  margin:auto;
  padding:16px 28px;
  display:flex;
  justify-content:space-between;
}

.brand{
  font-family:"Playfair Display",serif;
  letter-spacing:.25em;
}

/* ---------------- CRICKET ---------------- */

.cricket-container{
  position:fixed;
  bottom:32px;
  left:50%;
  transform:translateX(-50%);
  width:140px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
  z-index:20;
}

.wicket{
  width:14px;
  height:90px;
  background:#8b5a2b;
  transform-origin:bottom;
}

.ball{
  width:40px;
  height:40px;
  border-radius:50%;
  position:fixed;
  bottom:16px;
  left:16px;
  z-index:30;
  filter:drop-shadow(0 8px 5px rgba(0,0,0,.25));
}

/* ---------------- COLLECTIONS ---------------- */

.collection{
  padding:120px 6vw 80px;
  opacity:0;
}

.collection h2{
  font-family:"Playfair Display",serif;
  font-size:clamp(40px,5vw,72px);
  margin-bottom:40px;
}

/* RED */
.red-main{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:32px;
}

.red-main img,
.red-main video{
  width:100%;
  height:60vh;
  object-fit:cover;
}

.red-grid{
  margin-top:32px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:24px;
}

.red-grid img{
  height:280px;
  object-fit:cover;
}

/* WHITE */
.white-grid{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:32px;
}

.white-grid > img{
  height:65vh;
  object-fit:cover;
}

.white-stack{
  display:grid;
  gap:24px;
}

.white-stack img{
  height:200px;
  object-fit:cover;
}

/* BLACK */
.black-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:32px;
}

.black-grid img{
  height:60vh;
  object-fit:cover;
}

/* FOOTER */
footer{
  padding:64px 24px;
  text-align:center;
  font-size:12px;
  color:#666;
  border-top:1px solid #eee;
}

/* MOBILE */
@media(max-width:900px){
  .red-main,
  .white-grid,
  .black-grid{
    grid-template-columns:1fr;
  }

  .red-grid{
    grid-template-columns:1fr;
  }

  .white-stack img{
    height:220px;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="brand">PEDDI</div>
  </div>
</header>

<!-- Cricket -->
<div class="cricket-container">
  <div class="wicket" id="w1"></div>
  <div class="wicket" id="w2"></div>
  <div class="wicket" id="w3"></div>
</div>
<div class="ball" id="ball"></div>

<!-- RED -->
<section class="collection" id="red" style="background:#ffe5e5;">
  <h2>Red Collection</h2>

  <div class="red-main">
    <img src="images/rtsm.jpeg">
    <video muted loop playsinline id="redVideo">
      <source src="videos/rtsmv.mp4">
    </video>
  </div>

  <div class="red-grid">
    <img src="images/rt3.jpeg">
    <img src="images/rts.jpeg">
    <img src="images/rts2.jpeg">
  </div>

  <img src="images/fsrs.jpeg" style="width:100%;height:340px;object-fit:cover;margin-top:24px;">
</section>

<!-- WHITE -->
<section class="collection" id="white" style="background:#f5f5f5;">
  <h2>White Collection</h2>

  <div class="white-grid">
    <img src="images/wts.jpeg">
    <div class="white-stack">
      <img src="images/wts2.jpeg">
      <img src="images/fsws.jpeg">
      <img src="images/fsws2.jpeg">
      <img src="images/fsws3.jpeg">
    </div>
  </div>
</section>

<!-- BLACK -->
<section class="collection" id="black" style="background:#111;color:#fff;">
  <h2>Black Collection</h2>

  <div class="black-grid">
    <img src="images/fsbs.jpeg">
    <img src="images/fsbs2.jpeg">
  </div>
</section>

<footer>© 2026 Peddi</footer>

<script>
gsap.registerPlugin(ScrollTrigger);

const ball = document.getElementById("ball");
const wickets = [w1,w2,w3];
const sections = [red,white,black];
const colors = ["red","white","black"];

sections.forEach((sec,i)=>{
  ScrollTrigger.create({
    trigger:sec,
    start:"top center",
    pin:true,
    onEnter:()=>{
      ball.style.background = colors[i];
      gsap.set(ball,{x:0,y:0});

      const r = wickets[i].getBoundingClientRect();

      gsap.to(ball,{
        x:r.left - 10,
        y:-160,
        duration:.7,
        ease:"power2.out",
        onComplete:()=>{
          gsap.to(wickets[i],{rotation:-90,duration:.4});
          gsap.to(sec,{opacity:1,duration:.5});
          if(i===0) document.getElementById("redVideo").play();
          gsap.to(ball,{
            x:window.innerWidth+100,
            y:window.innerHeight+100,
            duration:.6
          });
        }
      });
    }
  });
});
</script>

</body>
</html>
