<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Peddi — Winter ’26</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>

<style>
:root{
  --depth: 0 40px 80px rgba(0,0,0,.18);
}

body{
  margin:0;
  font-family:Inter,sans-serif;
  background:#fff;
  overflow-x:hidden;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(10px);
  z-index:100;
}
.nav{
  max-width:1400px;
  margin:auto;
  padding:14px 28px;
}
.brand{
  font-family:"Playfair Display",serif;
  letter-spacing:.25em;
}

/* CRICKET */
.cricket-container{
  position:fixed;
  bottom:28px;
  left:50%;
  transform:translateX(-50%);
  width:140px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
  z-index:20;
}
.wicket{
  width:14px;
  height:90px;
  background:#8b5a2b;
  transform-origin:bottom;
}
.ball{
  width:38px;
  height:38px;
  border-radius:50%;
  position:fixed;
  bottom:14px;
  left:14px;
  z-index:30;
}

/* SECTIONS */
.collection{
  padding:110px 6vw 90px; /* MUCH tighter */
  opacity:0;
  position:relative;
}

.collection h2{
  font-family:"Playfair Display",serif;
  font-size:clamp(42px,5vw,80px);
  margin-bottom:32px;
}

/* COMMON IMAGE FEEL */
.collection img,
.collection video{
  box-shadow:var(--depth);
  border-radius:2px;
}

/* ---------------- RED — HEAT & IMPACT ---------------- */
.red-stage{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:32px;
}

.red-stage img,
.red-stage video{
  height:56vh; /* unified scale */
  object-fit:cover;
}

.red-flow{
  margin-top:28px;
  display:flex;
  gap:20px;
}

.red-flow img{
  height:260px;
  flex:1;
  object-fit:cover;
}

/* ---------------- WHITE — AIR & LIGHT ---------------- */
.white-canvas{
  position:relative;
  display:grid;
  grid-template-columns:1.6fr 1fr;
  gap:28px;
}

.white-canvas > img{
  height:58vh;
  object-fit:cover;
}

.white-stack{
  display:grid;
  gap:18px;
}

.white-stack img{
  height:180px;
  object-fit:cover;
}

/* ---------------- BLACK — SHADOW & DEPTH ---------------- */
.black-room{
  display:flex;
  gap:40px;
}

.black-room img{
  height:58vh;
  width:50%;
  object-fit:cover;
  filter:contrast(1.05);
}

/* FOOTER */
footer{
  padding:60px 24px;
  text-align:center;
  font-size:12px;
  color:#666;
  border-top:1px solid #eee;
}

/* MOBILE */
@media(max-width:900px){
  .red-stage,
  .white-canvas,
  .black-room{
    grid-template-columns:1fr;
    flex-direction:column;
  }

  .red-flow{
    flex-direction:column;
  }

  .white-stack img{
    height:220px;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">
    <div class="brand">PEDDI</div>
  </div>
</header>

<!-- Cricket -->
<div class="cricket-container">
  <div class="wicket" id="w1"></div>
  <div class="wicket" id="w2"></div>
  <div class="wicket" id="w3"></div>
</div>
<div class="ball" id="ball"></div>

<!-- RED -->
<section class="collection" id="red" style="background:#ffe5e5;">
  <h2>Red Collection</h2>

  <div class="red-stage">
    <img src="images/rtsm.jpeg">
    <video muted loop playsinline id="redVideo">
      <source src="videos/rtsmv.mp4">
    </video>
  </div>

  <div class="red-flow">
    <img src="images/rt3.jpeg">
    <img src="images/rts.jpeg">
    <img src="images/rts2.jpeg">
    <img src="images/fsrs.jpeg">
  </div>
</section>

<!-- WHITE -->
<section class="collection" id="white" style="background:#f6f6f6;">
  <h2>White Collection</h2>

  <div class="white-canvas">
    <img src="images/wts.jpeg">
    <div class="white-stack">
      <img src="images/wts2.jpeg">
      <img src="images/fsws.jpeg">
      <img src="images/fsws2.jpeg">
      <img src="images/fsws3.jpeg">
    </div>
  </div>
</section>

<!-- BLACK -->
<section class="collection" id="black" style="background:#0f0f0f;color:#fff;">
  <h2>Black Collection</h2>

  <div class="black-room">
    <img src="images/fsbs.jpeg">
    <img src="images/fsbs2.jpeg">
  </div>
</section>

<footer>© 2026 Peddi</footer>

<script>
gsap.registerPlugin(ScrollTrigger);

const ball = document.getElementById("ball");
const wickets = [w1,w2,w3];
const sections = [red,white,black];
const colors = ["red","white","black"];

sections.forEach((sec,i)=>{
  ScrollTrigger.create({
    trigger:sec,
    start:"top center",
    pin:true,
    onEnter:()=>{
      ball.style.background = colors[i];
      gsap.set(ball,{x:0,y:0});
      const r = wickets[i].getBoundingClientRect();

      gsap.to(ball,{
        x:r.left - 10,
        y:-140,
        duration:.7,
        ease:"power2.out",
        onComplete:()=>{
          gsap.to(wickets[i],{rotation:-90,duration:.4});
          gsap.to(sec,{opacity:1,duration:.5});
          if(i===0) redVideo.play();
          gsap.to(ball,{
            x:window.innerWidth+80,
            y:window.innerHeight+80,
            duration:.6
          });
        }
      });
    }
  });
});
</script>

</body>
</html>
