<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Peddi — Winter ’26</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>

<style>
body { margin:0; font-family:Inter,sans-serif; background:#fefefe; overflow-x:hidden; }
header { position: fixed; top:0; width:100%; background: rgba(255,255,255,.92); backdrop-filter: blur(10px); z-index:100; }
.nav { max-width:1400px; margin:auto; padding:18px 32px; display:flex; justify-content:space-between; align-items:center; }
.brand { font-family:"Playfair Display",serif; font-size:18px; letter-spacing:.25em; }
.nav a { margin-left:26px; font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:#666; text-decoration:none; }
.nav a:hover { color:#111; }

/* Cricket container on right side */
.cricket-container {
  position:fixed;
  top:80px;
  right:20px; /* near scrollbar */
  width:60px;
  height:80vh;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  pointer-events:none;
  z-index:999;
}
.wicket {
  width:40px;
  height:100px;
  margin-bottom:15px;
  transform-origin:bottom center;
  cursor:pointer;
}
.ball {
  width:40px;
  height:40px;
  background:red;
  border-radius:50%;
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  filter: drop-shadow(0 5px 3px rgba(0,0,0,0.3));
  z-index:10;
}

/* Collections */
.collection { width:100%; min-height:80vh; display:flex; justify-content:center; align-items:center; flex-direction:column; gap:20px; padding:40px 20px; opacity:0;
  border-radius:8px; position:relative; overflow:hidden; transition: transform 0.6s ease, box-shadow 0.6s ease; }
.collection:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
.split { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; }
.split img, .split video { flex:1; min-width:250px; max-height:60vh; border-radius:4px; object-fit:contain; }

/* Lighting overlay for luxury feel */
.collection::before {
  content:"";
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  pointer-events:none;
  background: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, transparent 70%);
  mix-blend-mode:soft-light;
  opacity:0;
}

/* Footer */
footer { padding:60px 24px; text-align:center; font-size:12px; color:#666; border-top:1px solid #eee; }

@media(max-width:900px){
  .ball { width:35px; height:35px; }
  .split img, .split video { max-height:45vh; min-width:150px; }
  .cricket-container { width:40px; }
}
</style>
</head>
<body>

<header>
  <div class="nav">
    <div class="brand">PEDDI</div>
    <nav>
      <a href="#collection">Collection</a>
      <a href="#experience">Experience</a>
      <a href="#lookbook">Lookbook</a>
    </nav>
  </div>
</header>

<!-- Cricket container with SVG wickets -->
<div class="cricket-container" id="cricketContainer">
  <svg class="wicket" id="wicket1" viewBox="0 0 50 100">
    <rect x="10" y="0" width="5" height="100" fill="#8b5a2b"/>
    <rect x="20" y="0" width="5" height="100" fill="#8b5a2b"/>
    <rect x="30" y="0" width="5" height="100" fill="#8b5a2b"/>
    <rect x="10" y="0" width="25" height="5" fill="#8b5a2b"/>
    <rect x="10" y="50" width="25" height="5" fill="#8b5a2b"/>
    <rect x="10" y="95" width="25" height="5" fill="#8b5a2b"/>
  </svg>
  <svg class="wicket" id="wicket2" viewBox="0 0 50 100">
    <rect x="10" y="0" width="5" height="100" fill="#8b5a2b"/>
    <rect x="20" y="0" width="5" height="100" fill="#8b5a2b"/>
    <rect x="30" y="0" width="5" height="100" fill="#8b5a2b"/>
    <rect x="10" y="0" width="25" height="5" fill="#8b5a2b"/>
    <rect x="10" y="50" width="25" height="5" fill="#8b5a2b"/>
    <rect x="10" y="95" width="25" height="5" fill="#8b5a2b"/>
  </svg>
  <svg class="wicket" id="wicket3" viewBox="0 0 50 100">
    <rect x="10" y="0" width="5" height="100" fill="#8b5a2b"/>
    <rect x="20" y="0" width="5" height="100" fill="#8b5a2b"/>
    <rect x="30" y="0" width="5" height="100" fill="#8b5a2b"/>
    <rect x="10" y="0" width="25" height="5" fill="#8b5a2b"/>
    <rect x="10" y="50" width="25" height="5" fill="#8b5a2b"/>
    <rect x="10" y="95" width="25" height="5" fill="#8b5a2b"/>
  </svg>
  <div class="ball" id="ball"></div>
</div>

<!-- Collections -->
<section class="collection" id="redCollection" style="background:#ffe5e5;">
  <div class="split">
    <img src="images/rtsm.jpeg" alt="Red T-shirt Mannequin">
    <video id="redVideo" muted loop playsinline>
      <source src="videos/rtsmv.mp4" type="video/mp4">
    </video>
  </div>
  <img src="images/fsrs.jpeg" alt="Full Sleeve Red">
  <div class="split">
    <img src="images/rts.jpeg" alt="Red T-shirt">
    <img src="images/rts2.jpeg" alt="Red T-shirt Alt">
  </div>
</section>

<section class="collection" id="whiteCollection" style="background:#f5f5f5;">
  <img src="images/wts.jpeg" alt="White T-shirt">
  <div class="split">
    <img src="images/wts2.jpeg" alt="White T-shirt Alt">
    <img src="images/fsws.jpeg" alt="Full Sleeve White">
    <img src="images/fsws2.jpeg" alt="Full Sleeve White Alt">
    <img src="images/fsws3.jpeg" alt="Full Sleeve White Alt 2">
  </div>
</section>

<section class="collection" id="blackCollection" style="background:#111; color:#fff;">
  <div class="split">
    <img src="images/fsbs.jpeg" alt="Black Sleeve">
    <img src="images/fsbs2.jpeg" alt="Black Sleeve Alt">
    <img src="images/fsbs.jpeg" alt="Black Sleeve Duplicate">
  </div>
</section>

<footer>© 2026 Peddi</footer>
<audio id="hitSound" src="wicket-hit.mp3"></audio>

<script>
gsap.registerPlugin(ScrollTrigger);

// Ball and wickets
const ball = document.getElementById("ball");
const wickets = [
  document.getElementById("wicket1"),
  document.getElementById("wicket2"),
  document.getElementById("wicket3")
];
const collections = [
  document.getElementById("redCollection"),
  document.getElementById("whiteCollection"),
  document.getElementById("blackCollection")
];
const redVideo = document.getElementById("redVideo");
const hitSound = document.getElementById("hitSound");

// Hide collections initially
collections.forEach(c => c.style.opacity=0);
redVideo.pause();

// Ball trail
const trail = ball.cloneNode(true);
trail.style.background = "rgba(255,0,0,0.2)";
trail.style.zIndex = "5";
ball.parentElement.appendChild(trail);

// Animate a single wicket + collection
function animateStep(idx, scrollStart){
  ScrollTrigger.create({
    trigger: collections[idx],
    start: "top "+scrollStart,
    end: "+=400",
    pin:true,
    onEnter: ()=>{
      gsap.to(ball,{
        y:-180,
        rotation:360,
        scaleX:1.3,
        scaleY:0.7,
        duration:0.6,
        ease:"power2.out",
        onUpdate:()=>{ trail.style.bottom = ball.style.bottom; },
        onComplete: ()=>{
          gsap.to(ball,{
            y:0,
            rotation:720,
            scaleX:1,
            scaleY:1,
            duration:0.5,
            ease:"bounce.out"
          });
          hitSound.currentTime=0;
          hitSound.play();
          gsap.to(wickets[idx], {rotation:-90, duration:0.5, ease:"power2.inOut"});
          gsap.to(collections[idx], {opacity:1, duration:0.5});
          if(idx===0) redVideo.play();
        }
      });
    }
  });
}

// Sequential animation
animateStep(0,"top");
animateStep(1,"top+=100");
animateStep(2,"top+=200");

// Parallax for images/videos
collections.forEach(collection=>{
  const elements = collection.querySelectorAll('img, video');
  elements.forEach(el=>{
    gsap.to(el, {
      y:30,
      scrollTrigger: {
        trigger: collection,
        start: "top bottom",
        end: "bottom top",
        scrub: true
      }
    });
  });
});
</script>

</body>
</html>
