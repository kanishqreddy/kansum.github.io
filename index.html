<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Peddi — Winter ’26 Collection</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Fonts (Editorial) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:#fff;
    --text:#111;
    --accent:#c1121f;
    --muted:#666;
    --maxw:1400px;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{font-family:Inter,sans-serif;color:var(--text);background:var(--bg);}

  header{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid #eee;z-index:10;}
  .nav{max-width:var(--maxw);margin:auto;padding:18px 30px;display:flex;justify-content:space-between;align-items:center;}
  .brand{font-family:"Playfair Display",serif;font-size:20px;font-weight:700;letter-spacing:.2em;}
  .nav a{margin-left:24px;font-size:13px;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);text-decoration:none;}
  .nav a:hover{color:var(--text);}

  section{padding:120px 24px;}
  .container{max-width:var(--maxw);margin:auto;}

  /* HERO */
  .hero{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;min-height:80vh;}
  .hero-text{font-family:"Playfair Display",serif;font-weight:700;font-size:clamp(48px,8vw,120px);line-height:1.05;}
  .hero img{width:100%;height:80vh;object-fit:cover;border-radius:8px;}

  /* FULL MEDIA */
  .full-screen{padding:0;}
  .full-screen img,
  .full-screen video{width:100%;height:90vh;object-fit:cover;}

  /* PANELS */
  .panels{display:grid;grid-template-columns:1fr 1fr;gap:40px;}
  .panel img{width:100%;border-radius:10px;}

  .headline {font-family:"Playfair Display",serif;font-size:40px;letter-spacing:.05em;margin-bottom:30px;}

  .grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:48px;}

  footer{padding:50px 24px;text-align:center;font-size:12px;letter-spacing:.18em;color:var(--muted);border-top:1px solid #eee;}
</style>
</head>
<body>

<header>
  <div class="nav">
    <span class="brand">PEDDI</span>
    <nav>
      <a href="#collection">Collection</a>
      <a href="#video">Experience</a>
      <a href="#lookbook">Lookbook</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-text">
    WINTER<br>’26<br>COLLECTION
  </div>
  <img src="images/rt3.jpeg" alt="Red T-Shirt on Model">
</section>

<!-- STATEMENT -->
<section>
  <div class="container">
    <p style="font-size:20px;max-width:720px;color:var(--muted);">
      Peddi’s Winter ’26 collection blends understated silhouettes with bold essentials — crafted for everyday confidence.
    </p>
  </div>
</section>

<!-- FULL SCREEN MEDIA RUN -->
<section class="full-screen">
  <img src="images/rtsm.jpeg" alt="Red T-Shirt Mannequin">
</section>

<section class="full-screen">
  <img src="images/wts2.jpeg" alt="White T-Shirt Alternative">
</section>

<section class="full-screen">
  <img src="images/fsbs2.jpeg" alt="Black Full Sleeve Alternate">
</section>

<!-- COLLECTION GRID -->
<section id="collection">
  <div class="container">
    <h2 class="headline">The Complete Lineup</h2>

    <div class="grid-3">
      <figure><img src="images/rts2.jpeg"><figcaption>Red T-Shirt</figcaption></figure>
      <figure><img src="images/rts.jpeg"><figcaption>Red T-Shirt (Alt)</figcaption></figure>
      <figure><img src="images/fsrs.jpeg"><figcaption>Full Sleeve Red</figcaption></figure>
      <figure><img src="images/fsbs.jpeg"><figcaption>Full Sleeve Black</figcaption></figure>
      <figure><img src="images/wts.jpeg"><figcaption>White T-Shirt</figcaption></figure>
      <figure><img src="images/fsws.jpeg"><figcaption>Full Sleeve White</figcaption></figure>
      <figure><img src="images/fsws2.jpeg"><figcaption>White Full Sleeve Alt</figcaption></figure>
      <figure><img src="images/fsws3.jpeg"><figcaption>White Full Sleeve Alt 2</figcaption></figure>
    </div>
  </div>
</section>

<!-- VIDEO EXPERIENCE -->
<section id="video" class="full-screen">
  <video autoplay muted loop playsinline>
    <source src="videos/rtsmv.mp4" type="video/mp4">
  </video>
</section>

<!-- LOOKBOOK PANELS -->
<section id="lookbook">
  <div class="container">
    <h2 class="headline">Styled Looks</h2>
    <div class="panels">
      <div class="panel"><img src="images/wts.jpeg" alt="White T-Shirt Look"></div>
      <div class="panel"><img src="images/rt3.jpeg" alt="Red T-Shirt Look"></div>
    </div>
  </div>
</section>

<footer id="contact">
  © 2026 Peddi
</footer>

</body>
</html>
