name: Forecast Lab Update

on:
  schedule:
    # All times in UTC. IST = UTC + 5:30.
    # Runs every 15 min during NSE market hours (9:15 AM - 3:30 PM IST = 03:45 - 10:00 UTC)
    - cron: "*/15 3-9 * * 1-5"
    # Extra run at 10:01 UTC (= 15:31 IST) to trigger the accuracy check just after close
    - cron: "1 10 * * 1-5"
    # One run pre-market (8:00 AM IST = 02:30 UTC) to refresh overnight news
    - cron: "30 2 * * 1-5"
  workflow_dispatch: {}   # allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance feedparser

      - name: Run forecast engine
        run: python forecast_engine.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add forecast_data.json
          git diff --quiet --cached || git commit -m "Update forecast data [skip ci]"
          git push
