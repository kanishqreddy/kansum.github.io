name: Forecast Lab Update

on:
  schedule:
    # All times UTC. IST = UTC + 5:30.
    # Pre-market: 8:30 AM IST = 03:00 UTC -> generates "today's" prediction set
    - cron: "0 3 * * 1-5"
    # Mid-day refresh (re-scores using latest data, doesn't change predicted price)
    - cron: "30 6 * * 1-5"
    # Post-close: 3:35 PM IST = 10:05 UTC -> runs accuracy check vs previous day
    - cron: "5 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance feedparser

      - name: Run forecast engine
        run: python forecast_engine.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add forecast_data.json accuracy_by_symbol.json
          git diff --quiet --cached || git commit -m "Update forecast data [skip ci]"
          git push
